<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EcoLoto - Configuracion</title>
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body data-secure="true">
    <div class="layout">
      <aside class="sidebar">
        <h2>EcoLoto</h2>
        <p class="small">Usuario: <strong id="topUser">-</strong></p>
        <ul class="menu">
          <li><a href="panel.html">Inicio</a></li>
          <li><a href="perfil.html">Perfil</a></li>
          <li><a href="configuracion.html" class="active">Configuracion</a></li>
          <li><a href="notificaciones.html">Notificaciones</a></li>
        </ul>
        <button id="logoutBtn" class="btn secondary" type="button">Cerrar sesion</button>
      </aside>

      <main class="main">
        <div class="topbar">
          <strong>Configuracion</strong>
          <span class="badge">Participacion: <span id="topParticipation">-</span></span>
        </div>

        <form id="settingsForm">
          <label for="theme">Color de tema</label>
          <select id="theme" name="theme">
            <option value="green">Verde</option>
            <option value="blue">Azul</option>
            <option value="orange">Naranja</option>
          </select>

          <label for="fontSize">Tamano de letra</label>
          <select id="fontSize" name="fontSize">
            <option value="14">Pequena</option>
            <option value="16">Media</option>
            <option value="18">Grande</option>
          </select>

          <label for="language">Idioma</label>
          <select id="language" name="language">
            <option value="es">Espanol</option>
            <option value="en">English</option>
          </select>

          <button class="btn" type="submit">Guardar configuracion</button>
          <p id="settingsOk" class="small"></p>
        </form>
      </main>
    </div>
    <script src="../js/app.js"></script>
  </body>
</html>
